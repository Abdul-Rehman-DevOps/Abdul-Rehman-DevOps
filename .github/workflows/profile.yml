name: Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "logos/**"
      - "README.md"
      - ".github/workflows/profile.yml"
      - ".github/scripts/**"

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%230891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/snake-dark.svg?color_snake=%23C084FC&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate projects panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch_data.py
          mkdir -p out projects
          python3 .github/scripts/generate_projects.py merged.json out
          cp out/projects.svg projects/projects.svg
          cp out/projects-light.svg projects/projects-light.svg

      - name: Stage generated assets
        run: |
          mkdir -p snake
          cp dist/snake-light.svg snake/snake-light.svg
          cp dist/snake-dark.svg snake/snake-dark.svg
          git add snake/snake-light.svg snake/snake-dark.svg
          git add profile-3d-contrib || true
          git add projects/projects.svg projects/projects-light.svg

      - name: Commit and push (single update)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --staged --quiet; then
            echo "No profile asset changes"
            exit 0
          fi

          git commit -m "Update profile assets [skip ci]"

          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push conflict on attempt $i — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done

          echo "Failed to push after retries"
          exit 1
