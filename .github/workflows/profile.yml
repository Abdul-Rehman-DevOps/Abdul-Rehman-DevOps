name: Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%230891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/snake-dark.svg?color_snake=%23C084FC&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE

      - name: Commit and push snake
        run: |
          mkdir -p snake
          cp dist/snake-light.svg snake/snake-light.svg
          cp dist/snake-dark.svg snake/snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake/snake-light.svg snake/snake-dark.svg
          if git diff --staged --quiet; then
            echo "No snake changes"
            exit 0
          fi
          git commit -m "Update contribution snake [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
